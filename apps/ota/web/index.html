<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CH585 WebUSB OTA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Mosaic MCU</p>
        <h1>CH585 WebUSB OTA</h1>
      </div>
      <span id="device-state" class="state" data-kind="idle">未连接</span>
    </header>

    <section class="workspace" aria-label="固件升级">
      <div class="device-row">
        <div>
          <span class="label">USB 设备</span>
          <strong id="device-name">CH585 OTA Disk + WebUSB</strong>
        </div>
        <button id="connect" type="button">连接设备</button>
      </div>

      <label class="file-field" for="firmware">
        <span class="label">OTA 固件包</span>
        <input id="firmware" type="file" accept=".ota,application/octet-stream">
      </label>

      <div class="package-meta">
        <span id="file-name">尚未选择文件</span>
        <span id="file-size">0 B</span>
      </div>

      <div class="progress" role="progressbar" aria-valuemin="0"
           aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar"></div>
      </div>

      <div class="actions">
        <button id="upgrade" class="primary" type="button" disabled>开始升级</button>
        <span id="progress-text">等待连接设备和选择固件</span>
      </div>
    </section>

    <section class="console" aria-label="传输日志">
      <div class="console-title">
        <span>传输日志</span>
        <button id="clear-log" class="quiet" type="button">清空</button>
      </div>
      <pre id="log" aria-live="polite"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
